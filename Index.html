<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#04101f;color:#dff3ff;font-family:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;left:0;top:0;pointer-events:none}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 2px,rgba(0,0,0,.07) 2px 4px)}
.lab{font-family:'Silkscreen',monospace;text-transform:uppercase;letter-spacing:.3em;font-size:11px;color:#6f93ad}

/* pixel boxes */
.px{--c:#2f7aa8;--bg:#071326;position:relative;background:var(--c);padding:3px;clip-path:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px))}
.px>.in{background:var(--bg);height:100%;clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
#hudrow,#icons{max-width:980px;margin-left:auto;margin-right:auto}
#hudrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stat{min-width:104px;max-width:36vw}
.stat .in{padding:9px 14px 8px}
.stat .v{font-size:clamp(26px,7vw,36px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
#dv{color:#52e1ff}#sv{color:#ff5f8a;text-align:right}
#sc .lab{text-align:right}
#prog{text-align:center;padding-top:8px}
#sq{display:flex;gap:5px;justify-content:center}
#sq i{display:block;width:clamp(16px,4.6vw,24px);height:clamp(16px,4.6vw,24px);background:#0a1936;border:3px solid #20407a}
#sq i.cur{background:#ff5f8a;border-color:#2a0d1a}
#sq i.done{border-color:#05101f}
#plab{margin-top:6px;font-size:10px}
#icons{display:flex;justify-content:space-between;margin-top:10px}
.ibtn{pointer-events:auto;width:54px;height:46px;cursor:pointer;--c:#4a6580;--bg:#243a52;border:0;padding:3px;font:inherit}
.ibtn .in{display:grid;place-items:center;font-size:22px;color:#dff3ff;line-height:1}
.ibtn:active{filter:brightness(1.3)}
body.menu #hudrow>*:not(#icons),body.menu #prog{visibility:hidden}

/* question box */
#qbox{position:absolute;left:50%;transform:translateX(-50%);top:max(158px,23%);width:min(94%,640px);z-index:4;--c:#38566f;--bg:rgba(5,14,32,.88)}
#qbox .in{padding:16px 18px 14px}
#qlab{font-family:'Silkscreen',monospace;letter-spacing:.34em;font-size:12px;color:#ff5f8a}
#qtxt{font-size:clamp(22px,6.2vw,34px);font-weight:600;line-height:1.18;margin:10px 0 12px;color:#f2fbff}
#qhint{font-size:13px;color:#7fa3bd;letter-spacing:.12em}
#qtxt .ok{color:#7dffb0}#qtxt .bad{color:#ff7a88}
#qtxt small{display:block;font-size:.5em;font-weight:400;margin-top:6px;letter-spacing:.08em}
body.menu #qbox,body.over #qbox{display:none}

/* toasts */
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,0);z-index:6;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;text-align:center;font-family:'Silkscreen',monospace;font-size:13px;letter-spacing:.2em;padding:8px 14px;background:rgba(4,14,30,.85);border:3px solid #52e1ff;color:#bff3ff;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,-8px)}
#gain{position:absolute;z-index:6;pointer-events:none;font-size:30px;font-weight:700;color:#7dffb0;text-shadow:3px 3px 0 #04301c;opacity:0}
#gain.go{animation:fl 1.6s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px)}}

/* bottom bar */
#bar{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,780px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
#bar::before{content:'';position:fixed;left:0;right:0;bottom:0;height:150px;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(2,8,18,.85) 45%)}
body.menu #bar,body.over #bar{display:none}
#dial{flex:none;width:68px;height:68px;border-radius:50%;background:conic-gradient(#3de0ff calc(var(--p,100)*1%),#0a1830 0);display:grid;place-items:center;border:3px solid #17406a}
#dial span{width:50px;height:50px;border-radius:50%;background:#04101f;display:grid;place-items:center;font-size:24px;font-weight:700;color:#52e1ff;font-variant-numeric:tabular-nums}
#dial.low{background:conic-gradient(#ff5f6a calc(var(--p,100)*1%),#0a1830 0)}#dial.low span{color:#ff7a88}
#form{flex:1;display:flex;gap:10px;align-items:stretch;min-width:0}
#iw{flex:1;min-width:0}
#iw .px{--c:#3de0ff;--bg:#050f22}
#ans{width:100%;height:100%;min-height:50px;border:0;outline:0;background:transparent;color:#eaf9ff;font:inherit;font-size:clamp(18px,5vw,24px);padding:10px 12px;letter-spacing:.06em}
#ans::placeholder{color:#4f7189}
#tbar{height:5px;background:#3de0ff;margin-top:6px;width:100%;transform-origin:left}
#tbar.low{background:#ff5f6a}
#go{flex:none;width:clamp(92px,26vw,130px);cursor:pointer;--c:#ff5f8a;--bg:#7d2549;border:0;padding:3px;font:inherit}
#go .in{display:grid;place-items:center;font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(15px,4.3vw,20px);letter-spacing:.3em;color:#14060d;background:#ff5f8a;padding-left:.3em}
#go:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
#go:active:not(:disabled){filter:brightness(1.2)}

/* overlays */
.scr{position:absolute;inset:0;z-index:7;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.scr.on{display:block}
#menu{pointer-events:none}
#menu>*{pointer-events:auto}
#mwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(80px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
#logo{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(40px,13.5vw,100px);color:#fff;letter-spacing:.06em;line-height:1;margin-top:clamp(20px,6vh,70px);text-shadow:4px 4px 0 #ff4f7e,-4px -4px 0 #3fd0ff}
#tag{font-family:'Silkscreen',monospace;letter-spacing:.5em;font-size:clamp(11px,3vw,15px);color:#2a5a86;margin-top:14px;padding-left:.5em}
#rules{margin:18px 0 0;text-align:center;max-width:420px;font-size:15px;line-height:1.45;color:#2d5f86}
#mspace{flex:1;min-height:30px}
#packs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;max-width:520px}
.chip{font-family:'Silkscreen',monospace;font-size:12px;letter-spacing:.18em;color:#2d5f86;background:rgba(255,255,255,.4);border:3px solid #2d5f86;padding:8px 12px;cursor:pointer}
.chip.on{background:#ff5f8a;border-color:#7d2549;color:#14060d}
.mbtn{width:min(100%,520px);cursor:pointer;font:inherit;border:0;padding:3px;display:block;margin-top:14px}
.mbtn .in{display:flex;align-items:center;justify-content:center;gap:16px;padding:20px 12px;font-family:'Silkscreen',monospace;letter-spacing:.3em;font-size:clamp(16px,4.6vw,22px);color:#e4f7ff}
#begin{--c:#3de0ff;--bg:#071a38}
.mbtn:active{filter:brightness(1.25)}
#bestbox{width:min(100%,520px);--c:#3de0ff;--bg:rgba(5,20,45,.92)}
#bestbox .in{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
#bestbox b{font-size:26px;color:#ffd34e}
#how{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:.25em;color:#7fb2d4;margin-top:16px;cursor:pointer;background:none;border:0;padding:6px}
#modal{position:absolute;inset:0;z-index:9;display:none;place-items:center;padding:16px;background:rgba(2,8,18,.7)}
#modal.on{display:grid}
#modal .px{width:min(100%,460px);max-height:90%;--c:#52e1ff;--bg:#071a38}
#modal .in{padding:20px;overflow:auto;max-height:80vh}
#modal h3{margin:0 0 10px;font-family:'Silkscreen',monospace;letter-spacing:.25em;font-size:15px;color:#ff5f8a}
#modal p{margin:8px 0;font-size:16px;line-height:1.4;color:#cfe9f7}
#modal .mbtn{margin-top:10px}
#modal .mbtn .in{padding:14px 10px;font-size:14px}
#end{background:rgba(2,8,18,.55)}
#ewrap{min-height:100%;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
#ecard{width:min(100%,480px);--c:#52e1ff;--bg:rgba(5,16,36,.95)}
#ecard .in{padding:22px 18px 18px;text-align:center}
#etitle{font-family:'Silkscreen',monospace;letter-spacing:.3em;font-size:13px;color:#ff5f8a}
#edepth{font-size:clamp(46px,14vw,70px);font-weight:700;color:#52e1ff;line-height:1.05;margin:8px 0 2px;font-variant-numeric:tabular-nums}
#ezone{font-family:'Silkscreen',monospace;font-size:12px;letter-spacing:.2em;color:#8fb6cf}

#ecomp{font-size:15px;color:#cfe9f7;margin:12px 0 6px;line-height:1.35}
#escore{font-size:18px;color:#ff5f8a;margin-bottom:10px}
#erows{text-align:left;margin:10px 0 4px;border-top:2px solid #17406a}
.er{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:2px solid #0f2a4d;font-size:15px}
.er i{flex:none;width:12px;height:12px}
.er span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er em{font-style:normal;color:#8fd8ff;font-variant-numeric:tabular-nums}
.er small{display:block;color:#5d84a0;font-size:11px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
#ebtns{display:flex;gap:10px;margin-top:8px}
#ebtns .mbtn{margin-top:6px}
#ebtns .mbtn .in{padding:14px 8px;font-size:13px;letter-spacing:.2em}
#again{--c:#ff5f8a;--bg:#3a1226}
#copy{--c:#3de0ff;--bg:#071a38}
#flash{position:absolute;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle,rgba(255,40,60,0) 30%,rgba(255,40,60,.5));opacity:0;transition:opacity .4s}
#flash.on{opacity:1;transition:opacity .04s}
@media (max-height:560px){
 #hud{padding-top:calc(6px + env(safe-area-inset-top))}

 #icons{position:absolute;top:8px;left:50%;transform:translateX(-50%);gap:8px;margin:0;width:auto;max-width:none}
 .ibtn{width:40px;height:34px}
 #qbox{top:78px}#qbox .in{padding:10px 14px 8px}

</style>
</head>

function parseAns(s){
  const p=s.split(':'),tier=+p[1];
  return {name:p[0],tier:tier,names:[p[0]].concat((p[2]||'').split(',').filter(Boolean)),depth:TIERS[tier].d+hash(p[0])%50};
}
function norm(s){
  const t=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ')
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().replace(/^the /,'');
  return t.split(' ').map(function(w){return (w.length>3&&w.endsWith('s')&&!w.endsWith('ss'))?w.slice(0,-1):w;}).join(' ');
}
function lev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=[];for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}
    prev=cur;
  }
  return prev[n];
}
function matchAnswer(input,prompt){
  const q=norm(input);if(!q)return null;
  let best=null,bd=99;
  for(const a of prompt.answers){
    for(const nm of a.names){
      const n=norm(nm),d=lev(q,n),thr=n.length<=4?0:(n.length<=8?1:2);
      if(d<=thr&&d<bd){bd=d;best=a;}
    }
  }
  return best;
}

let AC=null,muted=false;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){AC.resume().catch(function(){});}
}
function tone(f,d,type,v,to,delay){
  if(!AC||muted)return;
  try{
    const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t0);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v||0.05,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+0.05);
  }catch(e){}
}

  bad(){tone(160,0.45,'sawtooth',0.08,55);tone(90,0.5,'square',0.05,40,0.05);},

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  scale=clamp(Math.round(W/190),2,4);
  LW=Math.ceil(W/scale);LH=Math.ceil(H/scale);
  cv.width=LW;cv.height=LH;dark.width=LW;dark.height=LH;
  cv.style.width=(LW*scale)+'px';cv.style.height=(LH*scale)+'px';
  ov.width=Math.floor(W*DPR);ov.height=Math.floor(H*DPR);ov.style.width=W+'px';ov.style.height=H+'px';

function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function E(cx,cy,rx,ry,c){
  ctx.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);
  const ri=Math.max(0,Math.round(ry));
  for(let y=-ri;y<=ri;y++){
    const k=ri>0?Math.sqrt(Math.max(0,1-(y*y)/(ri*ri+0.01))):1;
    const hw=Math.round(rx*k);
    ctx.fillRect(cx-hw,cy+y,hw*2+1,1);
  }
}
function P(pts,c){
  ctx.fillStyle=c;
  let y0=1e9,y1=-1e9;
  for(let i=0;i<pts.length;i++){y0=Math.min(y0,pts[i][1]);y1=Math.max(y1,pts[i][1]);}
  y0=Math.round(y0);y1=Math.round(y1);
  for(let y=y0;y<=y1;y++){
    const yy=y+.5,xs=[];
    for(let i=0;i<pts.length;i++){
      const a=pts[i],b=pts[(i+1)%pts.length];
      if((a[1]<=yy&&b[1]>yy)||(b[1]<=yy&&a[1]>yy)){xs.push(a[0]+(yy-a[1])/(b[1]-a[1])*(b[0]-a[0]));}
    }
    xs.sort(function(p,q){return p-q;});
    for(let i=0;i+1<xs.length;i+=2){
      const xa=Math.round(xs[i]),xb=Math.round(xs[i+1]);
      if(xb>xa)ctx.fillRect(xa,y,xb-xa,1);
    }
  }
}
function glow(x,y,r,col){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(Math.floor(x-r),Math.floor(y-r),Math.ceil(r*2)+1,Math.ceil(r*2)+1);
}

function pickType(d){
  const r=Math.random();
  if(d<300&&r<.1)return 'kelp';
  if(d>25&&d<1500&&r<.2)return 'shrimp';
  const q=Math.random();
  if(d<200){if(q<.5)return 'fish';if(q<.8)return 'school';if(q<.92)return 'shark';return 'whale';}
  if(d<1000){if(q<.28)return 'jelly';if(q<.5)return 'fish';if(q<.74)return 'squid';if(q<.9)return 'shark';return 'whale';}
  if(d<4000){if(q<.3)return 'jelly';if(q<.55)return 'angler';if(q<.78)return 'squid';return 'ghost';}
  if(d<6000){if(q<.35)return 'ghost';if(q<.65)return 'angler';return 'jelly';}
  if(q<.5)return 'ghost';if(q<.78)return 'jelly';return 'angler';
}
function mk(type,x,wy,dir,d){
  const c={type:type,x:x,wy:wy,dir:dir,ph:Math.random()*6.28,sp:rand(2,4),h:0,s:5,vx:0,bob:rand(0,6.28)};
  switch(type){
    case 'fish':c.s=rand(3,6);c.vx=dir*rand(9,22);c.h=d<200?rand(10,200):rand(0,25);break;
    case 'shark':c.s=rand(12,16);c.vx=dir*rand(12,22);c.sp=2;break;
    case 'whale':c.s=rand(20,26);c.vx=dir*rand(6,10);c.sp=1.2;break;
    case 'jelly':c.s=rand(5,9);c.vx=rand(-3,3);c.dir=1;c.h=d<1000?rand(300,340):rand(170,210);c.sp=rand(2,3);break;
    case 'squid':c.s=rand(5,8);c.vx=dir*rand(10,18);c.h=d<1000?350:190;c.sp=rand(3,5);break;
    case 'angler':c.s=rand(5,8);c.vx=dir*rand(5,10);c.sp=2;break;
    case 'ghost':c.s=rand(5,8);c.vx=dir*rand(5,11);c.sp=rand(2,3);break;
    case 'shrimp':c.s=3;c.vx=dir*rand(3,8);c.sp=rand(4,6);break;
    case 'kelp':c.s=rand(14,30);c.vx=0;c.dir=1;break;
  }
  return c;
}
function spawnOne(initial){
  const sy=(S.vel>8&&!initial)?LH+rand(10,120):rand(-20,LH+20);
  const wy=S.depth*PXM+(sy-subY);
  const d=wy/PXM;
  if(d<10||d>MAXD-10)return;
  const type=pickType(d),dir=Math.random()<.5?1:-1;
  const off=!initial&&S.vel<=8&&Math.random()<.7;
  const x=off?(dir>0?-40:LW+40):rand(0,LW);
  if(type==='school'){
    const h=rand(15,200),vx=dir*rand(12,20),n=5+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){const c=mk('fish',x-dir*rand(0,22),wy+rand(-10,10),dir,d);c.s=rand(2,3.5);c.vx=vx*rand(.93,1.07);c.h=h;creatures.push(c);}
  }else if(type==='kelp'){
    const c=mk('kelp',Math.random()<.5?rand(3,16):LW-rand(3,16),wy+rand(8,30),1,d);creatures.push(c);
  }else creatures.push(mk(type,x,wy,dir,d));
}

const STOPS=[[0,[88,200,236]],[100,[24,140,200]],[200,[12,96,160]],[600,[8,56,108]],[1000,[6,34,78]],[2000,[4,20,52]],[4000,[3,12,32]],[6000,[2,8,22]],[11000,[1,4,12]]];
function colorAt(d){
  if(d<=0)return STOPS[0][1];
  for(let i=1;i<STOPS.length;i++){
    if(d<=STOPS[i][0]){const a=STOPS[i-1],b=STOPS[i],f=(d-a[0])/(b[0]-a[0]);return [0,1,2].map(function(k){return a[1][k]+(b[1][k]-a[1][k])*f;});}
  }
  return STOPS[STOPS.length-1][1];
}
const q7=v=>Math.max(0,Math.min(255,Math.round(v/6)*6));
function cloud(x,y,s){
  E(x,y,s*1.4,s*.5,'#e6f4ff');E(x+s*.8,y-s*.4,s*.9,s*.45,'#f6fbff');E(x-s*.9,y-s*.1,s*.8,s*.4,'#f6fbff');
  E(x,y+Math.round(s*.3),s*1.3,Math.max(1,s*.2),'#bcdcf2');
}
function drawBackground(){
  const wl=Math.round(subY-S.depth*PXM);
  const start=wl-3*Math.ceil((wl+3)/3);
  for(let y=start;y<LH;y+=3){
    if(y+3<=wl){
      const f=clamp((y-start)/Math.max(30,wl-start),0,1);
      R(0,y,0,0,'#000');
      ctx.fillStyle='rgb('+q7(63+f*130)+','+q7(158+f*70)+','+q7(224+f*25)+')';
      ctx.fillRect(0,y,LW,3);
    }else{
      const d=Math.max(0,S.depth+(y+1.5-subY)/PXM),c=colorAt(d);
      ctx.fillStyle='rgb('+q7(c[0])+','+q7(c[1])+','+q7(c[2])+')';
      ctx.fillRect(0,y,LW,3);
    }
  }
  if(wl>-40){
    if(wl>50){
      glow(LW*.82,Math.max(16,wl*.4),26,'rgba(255,240,170,.55)');
      E(LW*.82,Math.max(16,wl*.4),8,8,'#ffe98a');
    }
    for(let i=0;i<4;i++){
      const cx=((S.t*4+i*LW/3.2)%(LW+90))-45,cy=wl*(.18+.17*i);
      if(cy<wl-10&&cy>6)cloud(cx,cy,5+i%2*2);
    }
    /* ship */
    const bx=Math.round(LW*.16),by=wl+Math.round(Math.sin(S.t*1.2));
    if(by>-20){
      P([[bx-13,by-3],[bx+13,by-3],[bx+8,by+4],[bx-8,by+4]],'#7a2a2a');
      R(bx-13,by-4,26,2,'#c9d4dc');R(bx-5,by-11,10,7,'#e8eef2');R(bx-3,by-9,3,3,'#3a6a99');R(bx+1,by-9,3,3,'#3a6a99');
      R(bx+3,by-15,3,4,'#cc3344');R(bx-1,by-20,1,9,'#444');R(bx,by-20,5,3,'#ff4f7e');
      ctx.fillStyle='rgba(30,140,200,.55)';ctx.fillRect(bx-14,by+1,30,6);
    }
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let x=0;x<LW;x++){ctx.fillRect(x,wl+Math.round(Math.sin(x*.28+S.t*2.2)),1,1);}

    for(let x=0;x<LW;x+=2){ctx.fillRect(x,wl+3+Math.round(Math.sin(x*.2+S.t*1.6)),2,1);}
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(0,wl+1,LW,9);

  if(S.depth<600){

      P([[x0,y0],[x0+14,y0],[x0-45,LH],[x0-75,LH]],'rgba(255,255,255,'+a.toFixed(3)+')');
    }
  }
}

/* ================= game flow ================= */
const input=$('ans'),goBtn=$('go');
function setGo(txt,dis){goBtn.firstElementChild.textContent=txt;goBtn.disabled=!!dis;}

function startGame(){
  initAudio();sfx.start();
  document.body.classList.remove('menu','over');
  $('menu').classList.remove('on');$('end').classList.remove('on');
  const pool=ALL.filter(function(p){return S.pack==='mix'||p[2]===S.pack;});
  const picks=shuffle(pool).slice(0,NPROMPT).map(function(p){return {q:p[0],answers:p[1].map(parseAns)};});
  S.run={prompts:picks,i:0,score:0,results:[]};
  S.depth=0;S.target=0;S.vel=0;S.lm=0;S.zone='Sunlight Zone';S.paused=false;
  creatures=[];bubbles=[];rings=[];

}
function showPrompt(){
  const r=S.run,p=r.prompts[r.i];

  $('qlab').textContent='PROMPT '+(r.i+1)+' OF '+NPROMPT;

}
function submitAnswer(timeout){
  if(S.mode!=='ask')return;
  const r=S.run,p=r.prompts[r.i],val=input.value.trim(),a=matchAnswer(val,p),left=Math.max(0,S.qt);

    input.value='';try{input.focus();}catch(e){}
    return;
  }
  input.blur();input.readOnly=true;
  let html='',hint='';
  const others=p.answers.filter(function(x){return x!==a;}).sort(function(x,y){return y.depth-x.depth;}).slice(0,3).map(function(x){return x.name;});
  if(a){
    const mult=Math.max(0.4,1-0.1*S.miss),gain=Math.max(0,Math.min(Math.round(a.depth*mult),MAXD-S.target)),pts=Math.round((TIERS[a.tier].p+Math.floor(left)*4)*mult);
    S.target+=gain;r.score+=pts;
    r.results.push({q:p.q,ans:a.name,tier:a.tier,depth:gain,pts:pts});
    S.mode='sinking';
    html='<span class="ok">✔ '+esc(a.name.toUpperCase())+'</span><small style="color:'+TIERS[a.tier].c+'">'+LS[a.tier]+' · +'+fmt(gain)+' m · +'+fmt(pts)+' pts'+(S.miss?' · '+S.miss+(S.miss===1?' miss':' misses')+' (-'+Math.round((1-mult)*100)+'%)':'')+'</small>';
    hint=others.length?'DEEPER OR OTHER: '+others.join(' · '):'';
    rings.push({r:6,a:1});sfx.good(a.tier);setTimeout(sfx.ping,260);
    floatGain('+'+fmt(gain)+'m');
    setGo('...',true);
  }else{
    r.results.push({q:p.q,ans:val||'—',tier:0,depth:0,pts:0});
    S.mode='reveal';S.shake=3;
    html='<span class="bad">✘ '+esc(val?val.toUpperCase():'TIME UP')+'</span><small style="color:#ff9aa6">'+(val?'NOT ON THE LIST':'NO ANSWER')+' · +0 m</small>';
    hint='ANSWERS WERE: '+p.answers.slice().sort(function(x,y){return y.depth-x.depth;}).slice(0,4).map(function(x){return x.name;}).join(' · ');
    sfx.bad();const f=$('flash');f.classList.add('on');setTimeout(function(){f.classList.remove('on');},110);
    setGo(r.i>=NPROMPT-1?'RESULTS':'NEXT',false);
  }
  $('qtxt').innerHTML=html;$('qhint').textContent=hint;
  buildSquares();setHud();
}
function nextPrompt(){
  if(S.mode!=='reveal')return;
  S.run.i++;
  if(S.run.i>=NPROMPT)endGame();else showPrompt();
}
function endGame(){
  S.mode='over';document.body.classList.add('over');
  input.blur();
  const d=Math.floor(S.depth),rec=d>S.best;
  if(rec){S.best=d;saveBest(d);}
  let lm='';for(const l of LANDMARKS){if(d>=l[0]-1)lm=l[1];}
  $('etitle').textContent=d>=MAXD-1?'🏆 BOTTOM OF THE OCEAN':'DIVE COMPLETE';
  $('edepth').textContent=fmt(d)+'m';
  $('ezone').textContent=zoneOf(d).toUpperCase();
  $('ebadge').innerHTML=rec&&d>0?'<span class="badge">NEW BEST DEPTH</span>':'';
  $('ecomp').textContent=lm?'You went deeper than '+lm+'.':'Not even the Eiffel Tower fits in that. Dive again!';
  $('escore').textContent='SCORE '+fmt(S.run?S.run.score:0)+(rec?'':' · BEST '+fmt(S.best)+'m');
  const rows=$('erows');rows.innerHTML='';
  (S.run?S.run.results:[]).forEach(function(r){
    const row=document.createElement('div');row.className='er';
    const sq=document.createElement('i');sq.style.background=r.tier?TIERS[r.tier].c:'#5a2a38';
    const mid=document.createElement('span');mid.textContent=r.ans;
    const sm=document.createElement('small');sm.textContent=r.q.replace(/^Name (an? |one of the )?/,'');mid.appendChild(sm);
    const em=document.createElement('em');em.textContent='+'+fmt(r.depth)+'m';
    row.appendChild(sq);row.appendChild(mid);row.appendChild(em);rows.appendChild(row);
  });
  $('end').classList.add('on');
  if(d>=MAXD-1)sfx.win();
  buildSquares();
}
function toMenu(){
  S.mode='menu';S.depth=0;S.target=0;S.vel=0;S.run=null;S.paused=false;
  creatures=[];bubbles=[];rings=[];for(let i=0;i<8;i++)spawnOne(true);
  document.body.classList.add('menu');document.body.classList.remove('over');
  $('end').classList.remove('on');$('menu').classList.add('on');$('modal').classList.remove('on');
  $('bestv').textContent=fmt(S.best)+' m';
  buildSquares();setHud();
}

(function(){
  const box=$('packs');
  PACKS.forEach(function(p){
    const b=document.createElement('button');b.className='chip'+(p[0]===S.pack?' on':'');b.textContent=p[1];
    b.addEventListener('click',function(){S.pack=p[0];[].forEach.call(box.children,function(c){c.classList.toggle('on',c===b);});});
    box.appendChild(b);
  });
})();
$('begin').addEventListener('click',startGame);
$('again').addEventListener('click',function(){startGame();});
$('copy').addEventListener('click',function(){
  const d=Math.floor(S.depth),txt='Serhii\'s Dive Quizz\n'+fmt(d)+' m deep · score '+fmt(S.run?S.run.score:0)+'\n'+(S.run?S.run.results.map(function(r){return r.tier?['','🟦','🟩','🟪','🟣','🟨'][r.tier]:'⬛';}).join(''):'');
  const b=$('copy').firstElementChild;
  try{navigator.clipboard.writeText(txt).then(function(){b.textContent='COPIED!';},function(){b.textContent='COPY FAILED';});}catch(e){b.textContent='COPY FAILED';}
  setTimeout(function(){b.textContent='COPY RESULT';},1600);
});
$('bar').addEventListener('submit',function(e){
  e.preventDefault();initAudio();
  if(S.mode==='ask')submitAnswer(false);else if(S.mode==='reveal')nextPrompt();
});
$('mute').addEventListener('click',function(){muted=!muted;$('mute').firstElementChild.textContent=muted?'×':'♪';initAudio();});

function openModal(html){$('mbody').innerHTML=html;$('modal').classList.add('on');S.paused=true;}
function closeModal(){$('modal').classList.remove('on');S.paused=false;if(S.mode==='ask'){try{input.focus();}catch(e){}}}
const HOWTO='<h3>HOW TO PLAY</h3><p>You get 7 prompts, 25 seconds each. Type <b>one</b> answer that fits the prompt.</p><p>Common answers sink you only a little. <b>Rare answers sink you much deeper</b>, so think past the obvious ones. A wrong answer or running out of time gives 0 m.</p><p>Typos are forgiven. Try to beat your best depth and reach the Challenger Deep at 10,935 m.</p>';
$('how').addEventListener('click',function(){openModal(HOWTO+'<button class="px mbtn" id="mclose" style="--c:#3de0ff;--bg:#071a38"><span class="in">GOT IT</span></button>');$('mclose').onclick=closeModal;});
$('menubtn').addEventListener('click',function(){
  if(S.mode==='menu'){openModal(HOWTO+'<button class="px mbtn" id="mclose" style="--c:#3de0ff;--bg:#071a38"><span class="in">GOT IT</span></button>');$('mclose').onclick=closeModal;return;}
  openModal('<h3>PAUSED</h3><button class="px mbtn" id="mres" style="--c:#3de0ff;--bg:#071a38"><span class="in">RESUME</span></button><button class="px mbtn" id="mend" style="--c:#ff5f8a;--bg:#3a1226"><span class="in">END DIVE</span></button><button class="px mbtn" id="mhow" style="--c:#4a6580;--bg:#142234"><span class="in">HOW TO PLAY</span></button>');
  $('mres').onclick=closeModal;
  $('mend').onclick=function(){$('modal').classList.remove('on');S.paused=false;if(S.mode==='ask'||S.mode==='reveal'||S.mode==='sinking'){S.target=S.depth;endGame();}};
  $('mhow').onclick=function(){openModal(HOWTO+'<button class="px mbtn" id="mclose" style="--c:#3de0ff;--bg:#071a38"><span class="in">BACK</span></button>');$('mclose').onclick=closeModal;};
});

/* ================= update ================= */
function update(dt){
  if(S.paused)dt=0;
  S.t+=dt;
  const diff=S.target-S.depth;
  if(diff>0.05){
    const v=clamp(diff*1.0,70,500),step=Math.min(diff,v*dt);
    S.depth+=step;S.vel=dt>0?step/dt:0;
  }else{S.vel*=0.85;if(S.vel<1)S.vel=0;}
  S.prop+=(6+S.vel*.04)*dt;
  S.shake=Math.max(0,S.shake-dt*10);

  if(S.mode!=='menu'){
    const z=zoneOf(S.depth);
    if(z!==S.zone){S.zone=z;toast('ENTERING THE '+z.toUpperCase());}
    while(S.lm<LANDMARKS.length&&S.depth>=LANDMARKS[S.lm][0]-0.5){
      if(LANDMARKS[S.lm][0]<MAXD)toast('DEEPER THAN '+LANDMARKS[S.lm][1].toUpperCase()+'!');
      S.lm++;
    }
  }
  if(S.mode==='ask'){
    S.qt-=dt;
    const n=Math.ceil(Math.max(0,S.qt));
    if(n!==S.tickN){S.tickN=n;if(n<=5&&n>0)sfx.tick();}
    const frac=clamp(S.qt/QTIME,0,1);
    $('dial').style.setProperty('--p',(frac*100).toFixed(1));
    $('dn').textContent=n;
    $('tbar').style.transform='scaleX('+frac.toFixed(3)+')';
    const low=S.qt<=5;$('tbar').classList.toggle('low',low);$('dial').classList.toggle('low',low);
    if(S.qt<=0)submitAnswer(true);
  }else if(S.mode==='sinking'){
    if(S.target-S.depth<0.5){
      S.mode='reveal';setGo(S.run.i>=NPROMPT-1?'RESULTS':'NEXT',false);
    }
  }
  S.bubT-=dt;
  if(S.bubT<=0&&dt>0){
    S.bubT=S.vel>20?0.05:0.18;
    bubbles.push({x:subX-26,y:subY+rand(-3,3),vy:rand(8,20),ph:rand(0,6.28)});
  }
  for(const b of bubbles){b.y-=(b.vy+S.vel*PXM*.6)*dt;b.x+=Math.sin(S.t*3+b.ph)*3*dt-5*dt;}
  bubbles=bubbles.filter(function(b){return b.y>-10&&b.y>subY-130;});
  for(const r of rings){r.r+=110*dt;r.a-=dt*.7;}
  rings=rings.filter(function(r){return r.a>0;});
  for(const p of snow){
    p.y+=(-S.vel*PXM*p.z*.9+2*p.z)*dt;p.x+=Math.sin(S.t*.5+p.z*9)*2*dt;
    if(p.y<-3){p.y=LH+3;p.x=Math.random()*LW;}
    if(p.y>LH+3){p.y=-3;p.x=Math.random()*LW;}
    if(p.x<-3)p.x=LW+3;if(p.x>LW+3)p.x=-3;
  }
  const N=LW<260?9:14;let g=0;
  while(creatures.length<N&&g++<3)spawnOne(false);
  const wd=S.depth*PXM;
  for(const c of creatures){c.x+=c.vx*dt;c.ph+=dt*c.sp;}
  creatures=creatures.filter(function(c){const sy=subY+c.wy-wd;return sy>-120&&sy<LH+160&&c.x>-90&&c.x<LW+90;});
  setHud();
}

/* ================= render ================= */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.imageSmoothingEnabled=false;
  drawBackground();
  drawSeabed();
  const wd=S.depth*PXM;
  for(const c of creatures){
    const sy=Math.round(subY+c.wy-wd+(c.type==='kelp'?0:Math.sin(S.t*.9+c.bob)*2));
    if(sy<-60||sy>LH+60)continue;
    ctx.save();ctx.translate(Math.round(c.x),sy);ctx.scale(c.dir,1);DRAW[c.type](c);ctx.restore();
  }
  const sa=.25+clamp(S.depth/800,0,1)*.5;
  for(const p of snow){ctx.fillStyle='rgba(205,232,255,'+(sa*(.3+p.z*.7)).toFixed(2)+')';ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
  const dk=clamp((S.depth-100)/1300,0,.9);
  if(dk>0.01){
    dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,LW,LH);
    dctx.fillStyle='rgba(0,4,12,'+dk.toFixed(3)+')';dctx.fillRect(0,0,LW,LH);
    dctx.globalCompositeOperation='destination-out';
    let g=dctx.createRadialGradient(subX,subY,4,subX,subY,70);
    g.addColorStop(0,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=g;dctx.fillRect(0,0,LW,LH);
    g=dctx.createLinearGradient(subX+22,0,subX+160,0);
    g.addColorStop(0,'rgba(0,0,0,.95)');g.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=g;dctx.beginPath();dctx.moveTo(subX+22,subY-2);dctx.lineTo(subX+160,subY-55);dctx.lineTo(subX+160,subY+55);dctx.lineTo(subX+22,subY+2);dctx.closePath();dctx.fill();
    ctx.drawImage(dark,0,0);
  }
  ctx.globalCompositeOperation='lighter';
  for(const c of creatures){
    const gf=GLOW[c.type];if(!gf)continue;
    const sy=Math.round(subY+c.wy-wd+Math.sin(S.t*.9+c.bob)*2);
    if(sy<-40||sy>LH+40)continue;
    ctx.save();ctx.translate(Math.round(c.x),sy);ctx.scale(c.dir,1);gf(c);ctx.restore();
  }
  drawSeabedGlow();
  ctx.globalCompositeOperation='source-over';
  for(const b of bubbles){R(b.x,b.y,2,2,'rgba(220,245,255,.75)');R(b.x+1,b.y+1,1,1,'rgba(150,200,230,.8)');}
  for(const r of rings){ctx.strokeStyle='rgba(120,255,220,'+clamp(r.a,0,1).toFixed(2)+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(subX,subY,Math.max(1,r.r),0,6.283);ctx.stroke();}
  drawSub();
  if(S.shake>0){const m=Math.round(S.shake);cv.style.transform='translate('+(Math.round(rand(-m,m))*scale)+'px,'+(Math.round(rand(-m,m))*scale)+'px)';}
  else if(cv.style.transform)cv.style.transform='';
  drawRuler();
}
function drawRuler(){
  octx.setTransform(DPR,0,0,DPR,0,0);octx.clearRect(0,0,W,H);
  if(S.mode==='menu')return;
  const x=W-12,k=PXM*scale,ypx=function(d){return (subY+(d-S.depth)*PXM)*scale;};
  const d0=S.depth+(0-subY)/PXM,d1=S.depth+(LH-subY)/PXM;
  octx.fillStyle='rgba(190,230,255,.28)';octx.fillRect(x-1,Math.max(0,ypx(0)),2,H);
  octx.font='12px Silkscreen,monospace';octx.textAlign='right';octx.textBaseline='middle';
  for(let d=Math.ceil(Math.max(0,d0)/50)*50;d<=Math.min(d1,MAXD+50);d+=50){
    const y=ypx(d),major=d%100===0;
    octx.fillStyle='rgba(190,230,255,.55)';octx.fillRect(x-(major?14:8),y,major?14:8,2);
    if(major){octx.fillStyle='rgba(200,235,255,.8)';octx.fillText(d===0?'0m':'-'+fmt(d)+'m',x-20,y);}
  }
  if(S.best>0&&S.best>=d0&&S.best<=d1){
    const y=ypx(S.best);octx.fillStyle='#ffd34e';octx.fillRect(x-26,y,28,2);
    octx.textAlign='right';octx.fillText('BEST',x-30,y);
  }
  const sy=subY*scale;
  octx.fillStyle='#ff5f8a';octx.beginPath();octx.moveTo(x-6,sy);octx.lineTo(x-20,sy-7);octx.lineTo(x-20,sy+7);octx.closePath();octx.fill();
}

/* ================= loop ================= */
for(let i=0;i<8;i++)spawnOne(true);
$('bestv').textContent=fmt(S.best)+' m';
buildSquares();setHud();
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
